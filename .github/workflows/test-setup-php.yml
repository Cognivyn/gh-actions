name: Test setup-php action

on:
  pull_request:
    paths:
      - 'setup-php/**'
      - '.github/workflows/test-setup-php.yml'
      - '.github/workflows/build-setup-php-image.yml'
  push:
    branches:
      - 'feature/setup-php-action'
  workflow_dispatch:
  # Runs after the image is published so the action under test pulls the
  # freshly built sswork/setup-php:8.3 tag instead of racing the build.
  workflow_run:
    workflows: ["Build and push setup-php Docker image"]
    types: [completed]
    branches: [main]

jobs:
  validate-setup-php:
    # For workflow_run events, only proceed when the image build succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2.28', '8.3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default; use the
          # commit that triggered the image build so we test that code.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Run local setup-php action
        id: setup
        uses: ./setup-php
        with:
          php-version: ${{ matrix.php-version }}
          extensions: 'openssl,mbstring,xml,pdo_mysql,curl,bcmath,gmp'
          install-composer: 'true'

      - name: Verify PHP version is installed
        shell: bash
        run: |
          php -v
          php -r "echo PHP_VERSION . PHP_EOL;"
          echo "${{ matrix.php-version }}" | grep -q "$(php -r 'echo PHP_MAJOR_VERSION . \".\" . PHP_MINOR_VERSION;')" || {
            echo "Installed PHP version does not match requested major.minor version";
            exit 1;
          }

      - name: Verify Composer is available
        shell: bash
        run: composer --version

      - name: Verify required PHP extensions are enabled
        shell: bash
        run: |
          php -m | grep -E 'openssl|mbstring|xml|pdo_mysql|curl|bcmath|gmp' >/dev/null
