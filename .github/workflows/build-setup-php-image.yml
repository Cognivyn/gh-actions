name: Build and push setup-php Docker image

on:
  push:
    branches:
      - main
    paths:
      - 'setup-php/**'
      - '.github/workflows/build-setup-php-image.yml'
  # The image bundles whatever PHP patch releases the base image had when it
  # was built. Consumers pin this action to a commit, so without a scheduled
  # rebuild the PHP patch level would freeze at the date of the last
  # `setup-php/**` change. Rebuilding monthly keeps security patches flowing
  # without re-introducing a per-job build.
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/cognivyn/gh-actions/setup-php
  HUB_IMAGE: sswork/setup-php

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            ${{ env.HUB_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            # Stable major.minor tag that setup-php/action.yml references.
            # Only produced on the default branch so a pull-request build can
            # never move the tag out from under consumers.
            type=raw,value=8.3,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./setup-php
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
