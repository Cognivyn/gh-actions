name: "Setup PHP"
description: "Install a pinned PHP version on the runner without external setup actions"

inputs:
  php-version:
    description: "Exact PHP version to install (for example 8.3.13)"
    required: true
    default: "8.3.13"
  extensions:
    description: "Comma-separated PHP extensions to install"
    required: false
    default: "mbstring,xml,curl,zip"
  install-composer:
    description: "Install Composer after PHP is installed"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install pinned PHP version
      shell: bash
      env:
        PHP_VERSION: ${{ inputs.php-version }}
        PHP_EXTENSIONS: ${{ inputs.extensions }}
        INSTALL_COMPOSER: ${{ inputs.install-composer }}
      run: bash "$GITHUB_ACTION_PATH/install-php.sh"

    - name: Check installed PHP version
      shell: bash
      run: php -v
