name: "Setup PHP"
description: "Install a pinned PHP version on the runner without external setup actions"
branding:
  icon: "terminal"
  color: "purple"

inputs:
  php-version:
    description: "Exact PHP version to install (for example 8.3.13)"
    required: true
    default: "8.3.13"
  extensions:
    description: "Comma-separated PHP extensions to install"
    required: false
    default: "mbstring,xml,curl,zip"
  install-composer:
    description: "Install Composer after PHP is installed"
    required: false
    default: "true"

runs:
  using: "docker"
  image: "Dockerfile"
