name: "Setup PHP"
description: "Install a pinned PHP version on the runner without external setup actions"
branding:
  icon: "terminal"
  color: "purple"

inputs:
  php-version:
    description: "PHP runtime to activate, as a major.minor.patch string (for example 8.3.13). Only the major.minor selects which preinstalled runtime is activated; the patch level is whatever the image ships. Supported: 8.2.x, 8.3.x"
    required: true
    default: "8.3.13"
  extensions:
    description: "Comma-separated PHP extensions to install"
    required: false
    default: "mbstring,xml,curl,zip"
  install-composer:
    description: "Install Composer after PHP is installed"
    required: false
    default: "true"

runs:
  using: "docker"
  # Pulled from Docker Hub instead of being built from setup-php/Dockerfile on
  # every job. The Dockerfile build took 4m39s-6m41s per job because it runs
  # apt-get update, adds the Ondrej PPA, and installs PHP 8.2 and 8.3 from
  # scratch. The image is built by build-setup-php-image.yml, which pushes it to
  # Docker Hub (public, so the runner can pull it anonymously) and to GHCR, and
  # is rebuilt monthly so PHP patch releases keep arriving.
  #
  # `:8.3` is a mutable tag by design: the monthly rebuild moves it so every
  # caller picks up new PHP patch releases. Pinning this action to a commit SHA
  # freezes the action definition (inputs and entrypoint contract) but NOT the
  # image contents -- the runner still pulls whatever `8.3` points to at run
  # time. For bit-for-bit reproducibility, pin the image by digest instead:
  # `docker://sswork/setup-php:8.3@sha256:<digest>`.
  image: "docker://sswork/setup-php:8.3"
