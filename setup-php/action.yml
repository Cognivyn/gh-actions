name: "Setup PHP"
description: "Install a pinned PHP version on the runner without external setup actions"
branding:
  icon: "terminal"
  color: "purple"

inputs:
  php-version:
    description: "PHP runtime to activate, as a major.minor.patch string (for example 8.3.13). Only the major.minor selects which preinstalled runtime is activated; the patch level is whatever the image ships. Supported: 8.2.x, 8.3.x"
    required: true
    default: "8.3.13"
  extensions:
    description: "Comma-separated PHP extensions to install"
    required: false
    default: "mbstring,xml,curl,zip"
  install-composer:
    description: "Install Composer after PHP is installed"
    required: false
    default: "true"

runs:
  using: "docker"
  # Pulled from GHCR instead of being built from setup-php/Dockerfile on every
  # job. The Dockerfile build took 4m39s-6m41s per job because it runs
  # apt-get update, adds the Ondrej PPA, and installs PHP 8.2 and 8.3 from
  # scratch. The image is built by build-setup-php-image.yml and rebuilt
  # monthly so PHP patch releases keep arriving.
  #
  # `:8.3` is a mutable tag by design (the monthly rebuild moves it). Callers
  # should pin this action to a commit SHA, which is what makes an unexpected
  # retag non-silent: moving the tag cannot change what a pinned caller runs
  # without a new commit here.
  image: "docker://ghcr.io/cognivyn/gh-actions/setup-php:8.3"
